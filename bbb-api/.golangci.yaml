version: "2"
linters:
  enable:
    - revive
  settings:
    revive:
      confidence: 0.8
      severity: warning
      rules:
        - name: blank-imports
        - name: context-as-argument
        - name: context-keys-type
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: if-return
        - name: increment-decrement
        - name: var-naming
          arguments:
            - []
            - []
        - name: var-declaration
        - name: range
        - name: exported
        - name: package-comments
        - name: receiver-naming
        - name: time-naming
        - name: unexported-return
        - name: indent-error-flow
        - name: errorf
  exclusions:
    generated: lax
    presets:
      - comments
      - common-false-positives
      - legacy
      - std-error-handling
    paths:
      - gen$
formatters:
  enable:
    - goimports
  exclusions:
    generated: lax
    paths:
      - gen$
