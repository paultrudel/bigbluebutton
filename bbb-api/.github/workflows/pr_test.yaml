name: PR Test
on:
  pull_request:
  workflow_call:

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: bbb-api
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: Install Go
        uses: actions/setup-go@v5
        with:
          go-version: 1.23.5
          cache-dependency-path: bbb-api/go.sum
      - name: Run linter
        uses: golangci/golangci-lint-action@v7
        with:
          version: latest
          working-directory: bbb-api
      - name: Run tests
        run: go test -v ./...